<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="887" viewBox="0 0 1440 887" role="img" aria-labelledby="title desc">
<title id="title">Private Monte Carlo on OCI</title><desc id="desc">The primary stack provisions the environment. An operator reached through Bastion submits Indexed Jobs; workers write to OCI File Storage and the operator reads the same export. The bucket delivers bootstrap files in both modes.</desc>
<defs>
<style>text{font-family:"DejaVu Sans",Arial,sans-serif}.top{fill:#fff;font-size:32px;font-weight:bold}.over{fill:#ffd6bf;font-size:14px;font-weight:bold;letter-spacing:1.5px}.sub{fill:#f1e7dd;font-size:17px}.key{fill:#605347;font-size:13px;font-weight:bold;letter-spacing:1px}.h{fill:#28231f;font-size:21px;font-weight:bold}.body{fill:#302d29;font-size:16px}.label{fill:#31634e;font-size:15px;font-weight:bold}.minor{fill:#5c5651;font-size:15px}.link{fill:none;stroke-width:3;stroke-linejoin:round}.control{stroke:#785348}.data{stroke:#287151}.alt{stroke:#477080;stroke-dasharray:8 5}</style>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#785348"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287151"/></marker>
<marker id="alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#477080"/></marker>
</defs>
<rect width="1440" height="887" fill="#f8f5f0"/><rect width="1440" height="114" fill="#332b26"/><rect width="9" height="114" fill="#c74634"/>
<text x="40" y="29" class="over">OCI  /  MONTE CARLO QUICKSTART                              ARCHITECTURE   01</text>
<text x="40" y="70" class="top">Private Monte Carlo on OCI</text>
<text x="40" y="99" class="sub">Deployment, runtime access, and the default result path in one region.</text>
<rect x="36" y="136" width="1368" height="80" rx="12" fill="#fff" stroke="#c9beb3" stroke-width="1.5" />
<text x="60" y="165" class="key">PROVISION ONCE</text>
<text x="60" y="194" class="h">Resource Manager or Terraform CLI</text>
<text x="530" y="167" class="body">Creates the private network, cluster, managed nodes, operator, registry, bucket and default file system.</text>
<text x="530" y="192" class="minor">Cloud Shell or a workstation can drive provisioning; neither submits simulation Jobs in this design.</text>
<rect x="36" y="235" width="1368" height="387" rx="14" fill="#fffcf8" stroke="#a06b52" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="58" y="269" class="key">PRIVATE VCN   /   RUNTIME</text>
<text x="58" y="296" class="minor">Model inputs and results stay on the private execution path.</text>
<rect x="56" y="320" width="254" height="132" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="74" y="347" class="key">01   /   CONNECT</text>
<text x="74" y="378" class="h">Bastion endpoint</text>
<text x="74" y="406" class="body">Approved client CIDR</text>
<text x="74" y="428" class="body">Time-limited Managed SSH</text>
<rect x="356" y="320" width="337" height="132" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="374" y="347" class="key">02   /   SUBMIT &amp; REDUCE</text>
<text x="374" y="378" class="h">Private operator VM</text>
<text x="374" y="406" class="body">Helm, kubectl and the reducer</text>
<text x="374" y="428" class="body">OCI access via instance principal</text>
<rect x="741" y="320" width="241" height="132" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="759" y="347" class="key">03   /   CONTROL</text>
<text x="759" y="378" class="h">OKE API endpoint</text>
<text x="759" y="406" class="body">Private endpoint :6443</text>
<text x="759" y="428" class="body">Enhanced cluster</text>
<rect x="1030" y="320" width="352" height="132" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="1048" y="347" class="key">04   /   COMPUTE</text>
<text x="1048" y="378" class="h">Managed OKE workers</text>
<text x="1048" y="406" class="body">Indexed Job on one selected profile</text>
<text x="1048" y="428" class="body">VCN-native Pods · image by digest</text>
<path class="link control" d="M310 386H352" marker-end="url(#control)"/>
<path class="link control" d="M693 386H737" marker-end="url(#control)"/>
<path class="link control" d="M982 386H1026" marker-end="url(#control)"/>
<rect x="667" y="496" width="356" height="100" rx="12" fill="#e9f3ec" stroke="#478469" stroke-width="1.5" />
<text x="688" y="521" class="key">DEFAULT   /   FILE STORAGE</text>
<text x="688" y="553" class="h">FSS mount target + export</text>
<text x="688" y="578" class="body">Private subnet · NFS via client NSGs</text>
<path class="link data" d="M1200 452V546H1027" marker-end="url(#data)"/>
<text x="1076" y="534" class="label">write partials</text>
<path class="link data" d="M667 546H525V456" marker-end="url(#data)"/>
<text x="372" y="523" class="label">read partials</text>
<text x="59" y="579" class="minor">Green arrows show result data, not mount requests.</text>
<text x="40" y="661" class="key">SUPPORTING SERVICES  /  SEPARATE FROM THE DEFAULT RESULT PATH</text>
<rect x="36" y="680" width="430" height="161" rx="12" fill="#edf4f6" stroke="#58808e" stroke-width="1.5" />
<text x="54" y="707" class="key">STORAGE   /   ALWAYS PRESENT</text>
<text x="54" y="738" class="h">Private Object Storage</text>
<text x="54" y="766" class="body">Operator downloads its bootstrap bundle.</text>
<text x="54" y="788" class="body">Worker writes here only when Object Storage</text>
<text x="54" y="810" class="body">is explicitly selected as the result backend.</text>
<rect x="488" y="680" width="408" height="161" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="506" y="707" class="key">SOFTWARE SUPPLY</text>
<text x="506" y="738" class="h">Private Container Registry</text>
<text x="506" y="766" class="body">Operator publishes the runtime image.</text>
<text x="506" y="788" class="body">Nodes pull by digest with a namespace-</text>
<text x="506" y="810" class="body">scoped pull secret.</text>
<rect x="918" y="680" width="486" height="161" rx="12" fill="#fff" stroke="#bcb5ab" stroke-width="1.5" />
<text x="936" y="707" class="key">OPTIONAL   /   IN CLUSTER</text>
<text x="936" y="738" class="h">Private metrics</text>
<text x="936" y="766" class="body">Prometheus scrapes kubelet and exporters.</text>
<text x="936" y="788" class="body">Grafana uses a private port-forward; there is</text>
<text x="936" y="810" class="body">no public dashboard or ingress.</text>
<text x="40" y="869" class="minor">Control arrows show the access and scheduling sequence. Worker count, availability domains and subnet sizes are deployment choices.</text>
</svg>
