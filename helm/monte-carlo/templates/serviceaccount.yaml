{{- if and .Values.serviceAccount.create (not .Values.run.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "monte-carlo.namespace" . }}
  labels:
    {{- include "monte-carlo.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
