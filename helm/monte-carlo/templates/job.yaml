{{- if .Values.run.enabled }}
{{- $digest := required "image.digest is required; deploy an immutable image digest" .Values.image.digest }}
{{- $spec := required "run.specJson is required when run.enabled is true" .Values.run.specJson }}
{{- $bucket := required "objectStorage.bucket is required when run.enabled is true" .Values.objectStorage.bucket }}
{{- $namespace := required "objectStorage.namespace is required when run.enabled is true" .Values.objectStorage.namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monte-carlo.runName" . }}-spec
  namespace: {{ include "monte-carlo.namespace" . }}
  labels:
    {{- include "monte-carlo.labels" . | nindent 4 }}
    monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
immutable: true
data:
  spec.json: |-
{{ $spec | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monte-carlo.runName" . }}
  namespace: {{ include "monte-carlo.namespace" . }}
  labels:
    {{- include "monte-carlo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulator
    monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
spec:
  completions: {{ .Values.run.parallelism }}
  parallelism: {{ .Values.run.parallelism }}
  completionMode: Indexed
  backoffLimit: {{ .Values.run.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.run.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.run.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "monte-carlo.labels" . | nindent 8 }}
        app.kubernetes.io/component: simulator
        monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: simulator
          image: "{{ .Values.image.repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - --spec
            - /config/spec.json
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: JOB_COMPLETIONS
              value: {{ .Values.run.parallelism | quote }}
            - name: OCI_OBJECT_STORAGE_BUCKET
              value: {{ $bucket | quote }}
            - name: OCI_OBJECT_STORAGE_NAMESPACE
              value: {{ $namespace | quote }}
            - name: OCI_OBJECT_STORAGE_PREFIX
              value: {{ .Values.objectStorage.prefix | quote }}
            - name: OCI_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "monte-carlo.runName" . }}-spec
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
