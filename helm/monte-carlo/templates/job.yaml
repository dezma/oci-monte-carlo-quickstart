{{- if .Values.run.enabled }}
{{- $digest := required "image.digest is required; deploy an immutable image digest" .Values.image.digest }}
{{- $spec := required "run.specJson is required when run.enabled is true" .Values.run.specJson }}
{{- $resultDeliveryMode := include "monte-carlo.resultDeliveryMode" . }}
{{- $bucket := "" }}
{{- $objectStorageNamespace := "" }}
{{- $fssClaimName := "" }}
{{- if eq $resultDeliveryMode "object_storage" }}
{{- $bucket = required "objectStorage.bucket is required when resultDelivery.mode is object_storage" .Values.objectStorage.bucket }}
{{- $objectStorageNamespace = required "objectStorage.namespace is required when resultDelivery.mode is object_storage" .Values.objectStorage.namespace }}
{{- else }}
{{- $fssClaimName = required "resultDelivery.fss.claimName is required when resultDelivery.mode is fss" .Values.resultDelivery.fss.claimName }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monte-carlo.runName" . }}-spec
  namespace: {{ include "monte-carlo.namespace" . }}
  labels:
    {{- include "monte-carlo.labels" . | nindent 4 }}
    monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
    {{- with .Values.run.gridId }}
    monte-carlo.oracle.com/grid-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.scenarioId }}
    monte-carlo.oracle.com/scenario-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkId }}
    monte-carlo.oracle.com/benchmark-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkProfile }}
    monte-carlo.oracle.com/benchmark-profile: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkPhase }}
    monte-carlo.oracle.com/benchmark-phase: {{ . | quote }}
    {{- end }}
immutable: true
data:
  spec.json: |-
{{ $spec | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monte-carlo.runName" . }}
  namespace: {{ include "monte-carlo.namespace" . }}
  labels:
    {{- include "monte-carlo.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulator
    monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
    {{- with .Values.run.gridId }}
    monte-carlo.oracle.com/grid-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.scenarioId }}
    monte-carlo.oracle.com/scenario-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkId }}
    monte-carlo.oracle.com/benchmark-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkProfile }}
    monte-carlo.oracle.com/benchmark-profile: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.benchmarkPhase }}
    monte-carlo.oracle.com/benchmark-phase: {{ . | quote }}
    {{- end }}
    {{- with .Values.run.queueName }}
    kueue.x-k8s.io/queue-name: {{ . | quote }}
    {{- end }}
spec:
  completions: {{ .Values.run.parallelism }}
  parallelism: {{ .Values.run.parallelism }}
  completionMode: Indexed
  backoffLimit: {{ .Values.run.backoffLimit }}
  {{- if ne .Values.run.backoffLimitPerIndex nil }}
  backoffLimitPerIndex: {{ .Values.run.backoffLimitPerIndex }}
  {{- end }}
  {{- if ne .Values.run.maxFailedIndexes nil }}
  maxFailedIndexes: {{ .Values.run.maxFailedIndexes }}
  {{- end }}
  {{- if .Values.run.podFailurePolicy.enabled }}
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: simulator
          operator: In
          values: [2]
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  {{- end }}
  activeDeadlineSeconds: {{ .Values.run.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.run.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "monte-carlo.labels" . | nindent 8 }}
        app.kubernetes.io/component: simulator
        monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
        {{- with .Values.run.gridId }}
        monte-carlo.oracle.com/grid-id: {{ . | quote }}
        {{- end }}
        {{- with .Values.run.scenarioId }}
        monte-carlo.oracle.com/scenario-id: {{ . | quote }}
        {{- end }}
        {{- with .Values.run.benchmarkId }}
        monte-carlo.oracle.com/benchmark-id: {{ . | quote }}
        {{- end }}
        {{- with .Values.run.benchmarkProfile }}
        monte-carlo.oracle.com/benchmark-profile: {{ . | quote }}
        {{- end }}
        {{- with .Values.run.benchmarkPhase }}
        monte-carlo.oracle.com/benchmark-phase: {{ . | quote }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # FSS result delivery does not require an OCI workload identity token.
      automountServiceAccountToken: {{ eq $resultDeliveryMode "object_storage" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.run.topologySpread.enabled }}
      # Keep the partitions of this one benchmark Job balanced across hosts.
      # minDomains prevents a one-node run from being reported as a comparable
      # two-node benchmark result.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              monte-carlo.oracle.com/run-id: {{ .Values.run.id | quote }}
      {{- end }}
      containers:
        - name: simulator
          image: "{{ .Values.image.repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - --spec
            - /config/spec.json
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: JOB_COMPLETIONS
              value: {{ .Values.run.parallelism | quote }}
            - name: MCQS_RESULT_DELIVERY_MODE
              value: {{ $resultDeliveryMode | quote }}
            {{- if eq $resultDeliveryMode "object_storage" }}
            - name: OCI_OBJECT_STORAGE_BUCKET
              value: {{ $bucket | quote }}
            - name: OCI_OBJECT_STORAGE_NAMESPACE
              value: {{ $objectStorageNamespace | quote }}
            - name: OCI_OBJECT_STORAGE_PREFIX
              value: {{ .Values.objectStorage.prefix | quote }}
            - name: OCI_REGION
              value: {{ .Values.objectStorage.region | quote }}
            {{- else }}
            - name: MCQS_FSS_RESULTS_DIR
              value: /results
            {{- end }}
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: temporary
              mountPath: /tmp
            {{- if eq $resultDeliveryMode "fss" }}
            - name: results
              mountPath: /results
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "monte-carlo.runName" . }}-spec
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
        {{- if eq $resultDeliveryMode "fss" }}
        - name: results
          persistentVolumeClaim:
            claimName: {{ $fssClaimName }}
        {{- end }}
{{- end }}
