# Apply only after the platform team has installed a tested Kueue release.
# The ResourceFlavor selects the existing OKE worker-node label created by this
# quickstart. Adjust nominal quota to the dedicated risk-batch pool's safe
# capacity; it is admission quota, not a Compute capacity reservation.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: monte-carlo-amd64
spec:
  nodeLabels:
    workload.oracle.com/monte-carlo: "true"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: monte-carlo-batch
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: monte-carlo-amd64
          resources:
            - name: cpu
              nominalQuota: "16"
            - name: memory
              nominalQuota: 64Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: monte-carlo-grid
  namespace: monte-carlo
spec:
  clusterQueue: monte-carlo-batch
