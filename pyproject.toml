[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-monte-carlo-quickstart"
version = "1.0.0"
description = "Reproducible Monte Carlo jobs for OCI OKE"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
